<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag para garantir o correto redimensionamento em dispositivos móveis (responsividade) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino Semanal | Fitness Planner</title>
    <!-- Link para a folha de estilo CSS personalizada -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="theme-male"> <!-- Inicia com o tema masculino por padrão -->

    <div class="app-container">
        
        <!-- ==========================================
             CABEÇALHO E SELETOR DE GÊNERO
             ========================================== -->
        <header>
            <div class="logo-section">
                <h1>FiiW HUNTER</h1>
                <p>Seu cronograma de treinamento de alta performance</p>
            </div>
            
            <!-- Botões seletores para alternar dinamicamente entre masculino e feminino -->
            <div class="gender-selector" id="gender-toggle-wrapper">
                <button id="btn-gender-male" class="gender-btn active" aria-label="Selecionar treino masculino">
                    <!-- Ícone minimalista masculino (Símbolo de Marte) -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
                        <circle cx="10" cy="14" r="5"></circle>
                        <line x1="19" y1="5" x2="14" y2="10"></line>
                        <polyline points="14 5 19 5 19 10"></polyline>
                    </svg>
                    Masculino
                </button>
                <button id="btn-gender-female" class="gender-btn" aria-label="Selecionar treino feminino">
                    <!-- Ícone minimalista feminino (Símbolo de Vênus) -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
                        <circle cx="12" cy="9" r="5"></circle>
                        <line x1="12" y1="14" x2="12" y2="21"></line>
                        <line x1="9" y1="18" x2="15" y2="18"></line>
                    </svg>
                    Feminino
                </button>
            </div>
        </header>

        <!-- ==========================================
             SELETOR DE DIAS DA SEMANA (D1 A D5)
             ========================================== -->
        <nav class="days-nav-wrapper">
            <div class="days-tabs" id="days-selector">
                <!-- Os botões de dias (Dia 1 ao Dia 5) serão injetados de forma dinâmica pelo JS -->
            </div>
        </nav>

        <!-- ==========================================
             BARRA DE PROGRESSO DO TREINO DO DIA
             ========================================== -->
        <section class="progress-panel" aria-label="Progresso do Treino">
            <div class="progress-header">
                <span>Progresso do Treino</span>
                <span id="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
        </section>

        <!-- ==========================================
             CORPO DO TREINO (EXERCÍCIOS E DETALHES)
             ========================================== -->
        <main>
            <!-- Informações detalhadas do músculo do dia e observações -->
            <div class="workout-info-header">
                <span class="workout-day-badge" id="workout-day-title">DIA 1</span>
                <h2 class="workout-target-group" id="workout-target-group">PEITO</h2>
                
                <div class="workout-meta-box">
                    <!-- Ícone informativo da lâmpada/dica -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A5 5 0 0 0 8 8c0 1 .3 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path>
                        <line x1="9" y1="18" x2="15" y2="18"></line>
                        <line x1="10" y1="22" x2="14" y2="22"></line>
                    </svg>
                    <span id="workout-meta-info">Carregando informações do treino...</span>
                </div>
            </div>

            <!-- Container onde os cards de exercícios serão injetados pelo JS -->
            <div class="exercises-list" id="exercises-list-container">
                <!-- Exercícios carregados dinamicamente -->
            </div>

            <!-- Seção de circuito metabólico exclusiva para alguns dias (ex: Feminino Dia 5) -->
            <section class="circuit-panel" id="circuit-container" style="display: none;">
                <!-- Conteúdo do circuito carregado dinamicamente -->
            </section>
        </main>

        <!-- ==========================================
             BOTÃO DE RESET DO HISTÓRICO DE EXERCÍCIOS
             ========================================== -->
        <footer class="reset-history-wrapper">
            <button class="btn-reset-workout" id="btn-reset-workout-data" aria-label="Resetar progresso dos treinos">
                <!-- Ícone de Lixeira -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
                Resetar Progresso
            </button>
        </footer>

        <!-- ==========================================
             WIDGET FLUTUANTE DO CRONÔMETRO DE DESCANSO
             ========================================== -->
        <section class="timer-widget" id="timer-widget-panel" aria-label="Cronômetro de descanso">
            <!-- Linha de progresso no topo do timer -->
            <div class="timer-progress-track">
                <div class="timer-bar-fill" id="timer-bar-fill"></div>
            </div>
            
            <div class="timer-widget-header">
                <span class="timer-title">
                    <!-- Ícone de Relógio -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    Cronômetro de Descanso
                </span>
            </div>
            
            <div class="timer-body">
                <div class="timer-timer-area">
                    <!-- Texto com contagem de tempo -->
                    <span class="timer-time-display" id="timer-time">00:00</span>
                    
                    <div class="timer-actions">
                        <!-- Botão de Iniciar/Pausar -->
                        <button class="timer-btn timer-btn-primary" id="timer-btn-toggle" aria-label="Iniciar/Pausar descanso">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                        </button>
                        <!-- Botão de Reiniciar -->
                        <button class="timer-btn timer-btn-secondary" id="timer-btn-reset" aria-label="Reiniciar descanso">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- Botões para selecionar tempos de descanso rápidos -->
                <div class="timer-presets">
                    <button class="timer-btn-preset" data-seconds="60" aria-label="60 segundos de descanso">60s</button>
                    <button class="timer-btn-preset" data-seconds="90" aria-label="90 segundos de descanso">90s</button>
                    <button class="timer-btn-preset" data-seconds="120" aria-label="120 segundos de descanso">120s</button>
                </div>
            </div>
        </section>

    </div>

    <!-- Script de lógica e gerenciamento de estado injetado no fim do body -->
    <script src="JS/script.js"></script>
</body>
</html>
