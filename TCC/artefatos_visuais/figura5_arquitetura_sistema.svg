<!-- Define a tag raiz do SVG com as dimensões de visualização adequadas para a página de TCC -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Definições de estilos e filtros para sombreamentos e efeitos visuais dos blocos -->
  <defs>
    <!-- Filtro de sombra suave para dar profundidade aos blocos do diagrama -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" flood-color="#000000"/>
    </filter>
    
    <!-- Gradiente azul para os blocos da camada de cliente/apresentação -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Gradiente cinza escuro para componentes locais e APIs de apoio -->
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Gradiente verde para a API do Spotify -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Definição de ponta de seta reutilizável para conexões unidirecionais ou bidirecionais -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Fundo branco do diagrama para se integrar perfeitamente ao corpo de texto de um TCC impresso -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Título principal da arquitetura do sistema FitTrack -->
  <text x="400" y="40" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    ARQUITETURA GERAL DO SISTEMA - FITTRACK
  </text>
  
  <!-- Subtítulo técnico indicando a tipologia da arquitetura cliente-servidor monolítica estática -->
  <text x="400" y="65" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Modelo Client-Side com Persistência Local e Integração de API de Terceiros
  </text>

  <!-- ===================================================================
       BLOCO 1: CAMADA DO SERVIDOR WEB (Hospedagem Estática)
       =================================================================== -->
  <!-- Comentário do Bloco: Representa onde o código HTML/CSS/JS está hospedado (ex: gym.fittrack.com.br) -->
  <g transform="translate(50, 180)" filter="url(#shadow)">
    <rect width="180" height="120" rx="8" fill="url(#darkGrad)"/>
    <text x="90" y="35" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Servidor de Arquivos</text>
    <text x="90" y="55" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Hospedagem Estática</text>
    <rect x="20" y="70" width="140" height="30" rx="4" fill="#334155"/>
    <text x="90" y="89" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1" font-weight="bold" text-anchor="middle">gym.fittrack.com.br</text>
  </g>

  <!-- ===================================================================
       BLOCO 2: CLIENTE (Navegador do Usuário executando o aplicativo web)
       =================================================================== -->
  <!-- Comentário do Bloco: Container principal que agrupa as tecnologias que rodam diretamente no navegador do cliente -->
  <g transform="translate(300, 100)" filter="url(#shadow)">
    <!-- Retângulo delimitador da Sandbox do Navegador do Usuário -->
    <rect width="220" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="110" y="30" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Navegador do Usuário</text>
    <text x="110" y="48" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">(Ambiente de Execução Client-Side)</text>
    
    <!-- Caixa do HTML5 - Responsável pela marcação e conteúdo estrutural da interface -->
    <rect x="20" y="70" width="180" height="50" rx="6" fill="url(#blueGrad)"/>
    <text x="110" y="90" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Estrutura (HTML5)</text>
    <text x="110" y="105" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#bfdbfe" text-anchor="middle">Visualização &amp; Layout Semântico</text>

    <!-- Caixa do CSS3 - Responsável pelas regras visuais de estilo, layouts e suporte de temas masculinos/femininos -->
    <rect x="20" y="135" width="180" height="50" rx="6" fill="url(#blueGrad)"/>
    <text x="110" y="155" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Estilização (CSS3)</text>
    <text x="110" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#bfdbfe" text-anchor="middle">Temas, Responsividade &amp; Grid</text>

    <!-- Caixa do JS Vanilla - Responsável pelo processamento de lógica de IMC, manipulação dinâmica de DOM e eventos -->
    <rect x="20" y="200" width="180" height="75" rx="6" fill="url(#blueGrad)"/>
    <text x="110" y="220" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Lógica (JavaScript Vanilla)</text>
    <text x="110" y="235" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#bfdbfe" text-anchor="middle">Gerenciador de Estados e Eventos</text>
    <text x="110" y="248" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">- Cálculo de IMC | - Cronômetro</text>
    <text x="110" y="248" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">- Cálculo de IMC | - Cronômetro</text>
    <text x="110" y="259" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">- Gerenciamento de Treinos/Dietas</text>
  </g>

  <!-- ===================================================================
       BLOCO 3: CAMADA DE ARMAZENAMENTO LOCAL (Persistência no Navegador)
       =================================================================== -->
  <!-- Comentário do Bloco: Representa a persistência de dados local sem banco de dados tradicional externo (LocalStorage) -->
  <g transform="translate(580, 100)" filter="url(#shadow)">
    <rect width="180" height="120" rx="8" fill="url(#darkGrad)"/>
    <text x="90" y="35" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">LocalStorage</text>
    <text x="90" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">(Armazenamento Local)</text>
    
    <!-- Lista dos dados armazenados na chave-valor do navegador do usuário -->
    <text x="20" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#f1f5f9" text-anchor="start">- Histórico de Medidas &amp; Peso</text>
    <text x="20" y="95" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#f1f5f9" text-anchor="start">- Treinos Customizados</text>
    <text x="20" y="110" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#f1f5f9" text-anchor="start">- Planejamento Alimentar</text>
  </g>

  <!-- ===================================================================
       BLOCO 4: INTEGRAÇÃO EXTERNA (Spotify Web API)
       =================================================================== -->
  <!-- Comentário do Bloco: Serviço de streaming integrado ao player Spotify Connect para controle dinâmico -->
  <g transform="translate(580, 280)" filter="url(#shadow)">
    <rect width="180" height="120" rx="8" fill="url(#greenGrad)"/>
    <text x="90" y="35" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Spotify Web API</text>
    <text x="90" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#f0fdf4" text-anchor="middle">(Serviço Externo REST)</text>
    
    <text x="20" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="start">- Autenticação OAuth 2.0</text>
    <text x="20" y="95" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="start">- Controle Remoto de Mídia</text>
    <text x="20" y="110" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="start">- Playlists do Usuário</text>
  </g>

  <!-- ===================================================================
       VETORES DE CONEXÃO E FLUXO (Setas e Anotações)
       =================================================================== -->
  <!-- Comentário do Bloco: Fluxo de Requisição de Arquivos Estáticos (Servidor -> Cliente) -->
  <path d="M 230 240 L 292 240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="232" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">HTTP GET</text>

  <!-- Comentário do Bloco: Comunicação LocalStorage (JS <-> Armazenamento Local - Leitura e Escrita Bidirecional) -->
  <path d="M 528 160 L 572 160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="550" y="152" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Leitura/Escrita</text>

  <!-- Comentário do Bloco: Integração com API Externa (JS <-> API Spotify - Conexão HTTP REST / Web Sockets) -->
  <path d="M 528 340 L 572 340" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="550" y="332" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Requisições HTTPS</text>
</svg>
